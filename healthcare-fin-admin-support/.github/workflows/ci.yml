name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint, test, build, SCA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Jest)
        run: npm test -- --coverage

      - name: SCA — production dependencies only
        # Fails on known CVEs in the dependency tree. Keep this strict.
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy (main only) — skeleton
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # TODO(org): wire real AWS credentials via OIDC role, not long-lived keys.
    # See docs/ComplianceReport.md § "Secret management".
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        run: |
          docker build -t $REGISTRY/hfas-api:${{ github.sha }} backend
          docker push $REGISTRY/hfas-api:${{ github.sha }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}

      # TODO(org): trigger ECS service redeploy / Lambda update here.
      # Keep KMS key rotation instructions in docs/ComplianceReport.md.
      - name: Deploy skeleton (no-op until ECS task defs exist)
        run: echo "TODO(org): register ECS task definition and update service"
