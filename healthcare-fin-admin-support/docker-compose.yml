version: "3.9"

# Local dev stack: Postgres + MinIO (S3-compatible) + API + web.
# Usage: docker compose up --build
# Seed data is auto-loaded on first DB start (scripts/seed_data.sql).
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hfas
      POSTGRES_PASSWORD: hfas
      POSTGRES_DB: hfas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/05-create_tables.sql:ro
      - ./backend/src/db/migrations/002_roadmap_features.sql:/docker-entrypoint-initdb.d/06-roadmap_features.sql:ro
      - ./backend/src/db/migrations/003_telemetry.sql:/docker-entrypoint-initdb.d/07-telemetry.sql:ro
      - ./scripts/seed_data.sql:/docker-entrypoint-initdb.d/10-seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hfas -d hfas"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hfas
      MINIO_ROOT_PASSWORD: hfas-secret-123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot bucket bootstrap (runs after storage is healthy).
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 hfas hfas-secret-123 &&
      mc mb --ignore-existing local/hfas-documents &&
      echo 'bucket ready';
      "

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://hfas:hfas@db:5432/hfas
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY_ID: hfas
      S3_SECRET_ACCESS_KEY: hfas-secret-123
      S3_FORCE_PATH_STYLE: "true"
      OCR_PROVIDER: mock
      OTP_DEV_MODE: "true"
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      FIELD_ENCRYPTION_DEV_KEY: dev-field-key-change-me
      WEBHOOK_SIGNING_SECRET: dev-webhook-secret-change-me
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  minio-data:
